name: Case Capital CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_ENABLED: "false"
      RUN_EXTERNAL_API_TESTS: "false"
      RUN_LIVE_TRADING_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest tests -q
      - run: bash -n ../deploy/vps/backup-postgres.sh ../deploy/vps/restore-postgres.sh ../deploy/vps/bootstrap-ubuntu-24.sh ../deploy/vps/setup-postgres.sh ../deploy/vps/install-operational-controls.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: CI=false npm run build
