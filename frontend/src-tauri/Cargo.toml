[package]
name = "case_capital_trading_terminal"
version = "0.1.0"
description = "CaseCapitalTradingTerminal desktop shell"
authors = ["Case Capital"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "case_capital_trading_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
